services:
  nightwarden:
    image: ghcr.io/prabhatmattoo/nightwarden:latest
    # Or build locally: docker compose build
    build: .
    restart: unless-stopped
    # Docker Desktop provides this name; Linux does not, and without it a
    # Prometheus or Loki on this same host is unreachable from in here.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${PORT:-3000}:3000"
    environment:
      # Must be routable from runners and Alertmanager, not just your browser.
      NIGHTWARDEN_PUBLIC_URL: ${NIGHTWARDEN_PUBLIC_URL:?set NIGHTWARDEN_PUBLIC_URL, e.g. http://203.0.113.10:3000}
      # One variable for all three references so the paths cannot drift.
      NIGHTWARDEN_DIR: ${NIGHTWARDEN_DIR:-/opt/nightwarden}
      # Unset means a key file is generated in NIGHTWARDEN_DIR and reused; set it
      # to manage the value yourself. Changing it makes stored credentials
      # unreadable and signs every owner session out.
      NIGHTWARDEN_SECRET_KEY: ${NIGHTWARDEN_SECRET_KEY:-}
      NIGHTWARDEN_LOG_LEVEL: ${NIGHTWARDEN_LOG_LEVEL:-info}
    # Everything optional rides the file rather than being named above: a name
    # listed above with no value is set to the empty string, which a provider SDK
    # reading its base URL at import rejects.
    # First-boot seeds all live in .env: NIGHTWARDEN_LLM_PROVIDER, the
    # <PROVIDER>_API_KEY / _MODEL / _BASE_URL trio, PROMETHEUS_URL, LOKI_URL and
    # the runner image overrides. See ARCHITECTURE.md#configuration.
    env_file:
      - path: .env
        required: false
    volumes:
      # Same path inside and out, never a named volume: the host daemon resolves
      # sandbox mounts against the host, so a container-only path mounts empty.
      - ${NIGHTWARDEN_DIR:-/opt/nightwarden}:${NIGHTWARDEN_DIR:-/opt/nightwarden}
      # Sandboxes and the egress proxy are sibling containers started here.
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
