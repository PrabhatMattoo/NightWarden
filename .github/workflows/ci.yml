name: CI

# Pull requests only: a push to main runs verify through publish-images.yml before
# it writes to the registry, so a second full suite here would repeat it.
on:
  pull_request:

# A superseded run on the same branch is answering a question nobody is asking.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
