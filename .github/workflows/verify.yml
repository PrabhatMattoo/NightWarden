# The one definition of green, called by ci.yml on every change and by
# publish-images.yml before it pushes, so a release meets a pull request's gate.
name: Verify

on:
  workflow_call:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Reads the pinned version from packageManager in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check

      # The committed database types must match what the migrations build.
      - run: pnpm --filter @nightwarden/api db:types:check

      - run: pnpm typecheck

      - run: pnpm lint

      # Dead code and unlisted dependencies fail here rather than accumulate.
      - run: pnpm knip

      - run: pnpm test

      # A pull request that cannot produce the artifact is not green. Without
      # this the break surfaces on the push to main, after review.
      - run: pnpm build
